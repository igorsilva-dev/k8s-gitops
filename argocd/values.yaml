configs:
  params:
    # TLS ends at the Tailscale Ingress proxy (argocd/config/ingress.yaml), so the server speaks HTTP.
    server.insecure: true

controller:
  replicas: 1
  metrics:
    enabled: true
  # live-arch draws this edge: Alloy scrapes the controller (observability/config).
  statefulsetAnnotations:
    live-arch.igorsilva.dev/flows-to: "observability/alloy:metrics"

redis-ha:
  enabled: false

server:
  service:
    type: ClusterIP

dex:
  enabled: false

notifications:
  enabled: false
