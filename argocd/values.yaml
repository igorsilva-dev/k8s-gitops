configs:
  params:
    # TLS ends at the Tailscale Ingress proxy (argocd/config/ingress.yaml), so the server speaks HTTP.
    server.insecure: true

controller:
  replicas: 1
  metrics:
    enabled: true

redis-ha:
  enabled: false

server:
  service:
    type: ClusterIP

dex:
  enabled: false

notifications:
  enabled: false
