# A fixed Argo CD admin password across rebuilds. Argo CD makes a random one on every install
# (argocd-initial-admin-secret); this merges a bcrypt hash from Doppler into argocd-secret instead,
# and Argo CD picks it up within seconds. Doppler holds the hash only, never the password.
#
# Merge, not Owner: the chart owns argocd-secret and its other keys (server.secretkey, ...).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-admin-password
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler
    kind: ClusterSecretStore
  target:
    name: argocd-secret
    creationPolicy: Merge
    template:
      data:
        admin.password: "{{ .hash }}"
        # Sessions issued before this time are invalid. Bump it when the password changes.
        admin.passwordMtime: "2026-10-29T00:00:00Z"
  data:
    - secretKey: hash
      remoteRef:
        key: ARGOCD_ADMIN_PASSWORD_HASH
