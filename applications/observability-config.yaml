apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-config
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: observability
  annotations:
    # After the CRDs (wave -2) and the collector (wave 0).
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  # Scrape targets for components whose charts or manifests don't ship their own ServiceMonitor.
  # Kept out of argocd/config, so a missing CRD on a fresh cluster can't fail Argo CD's self-sync.
  source:
    repoURL: https://github.com/igorsilva-dev/k8s-gitops
    targetRevision: main
    path: observability/config
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        maxDuration: 5m
        factor: 2
