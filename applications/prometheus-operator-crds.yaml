apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-operator-crds
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: observability
  annotations:
    # Before anything that ships a ServiceMonitor (the exporters, Alloy, crashdummy).
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  # The CRDs only: ServiceMonitor and PodMonitor are the scrape list Alloy reads. No operator and no
  # Prometheus server run in this cluster; Mimir stores the metrics (OBS-002).
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-operator-crds
    targetRevision: 32.0.2
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The CRDs exceed the client-side apply annotation limit.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        maxDuration: 5m
        factor: 2
