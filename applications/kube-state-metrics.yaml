apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-state-metrics
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: observability
  annotations:
    # After the Prometheus Operator CRDs (wave -2): the chart ships a ServiceMonitor.
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-state-metrics
      targetRevision: 8.8.0
      helm:
        releaseName: kube-state-metrics
        valueFiles:
          - $values/observability/kube-state-metrics.yaml
    - repoURL: https://github.com/igorsilva-dev/k8s-gitops
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        maxDuration: 5m
        factor: 2
