apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crashdummy
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: crashdummy
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/igorsilva-dev/k8s-gitops
    targetRevision: main
    path: crashdummy
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: agents
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        maxDuration: 5m
        factor: 2
