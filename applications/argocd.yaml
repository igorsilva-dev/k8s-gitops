apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
  annotations:
    # With ServerSideApply, a client-side diff flags the defaults the ExternalSecret CRD fills in
    # as drift (see tailscale-operator.yaml). Server-side diff dry-runs the apply instead.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.11.6
      helm:
        releaseName: argocd
        valueFiles:
          - $values/argocd/values.yaml
    - repoURL: https://github.com/igorsilva-dev/k8s-gitops
      targetRevision: main
      ref: values
    # The Tailscale Ingress (EDGE-002) and the admin password from Doppler. Applied with the chart,
    # so the UI comes up with Argo CD.
    - repoURL: https://github.com/igorsilva-dev/k8s-gitops
      targetRevision: main
      path: argocd/config
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
