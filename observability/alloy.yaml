# The collector: one Alloy pod per node. Targets come from ServiceMonitor and PodMonitor objects,
# plus the kubelet and cAdvisor on every node. Clustering splits the targets across the pods, so each
# target is scraped once, whichever node it runs on.
#
# Nothing stores the samples yet: every forward_to is empty until Mimir lands (OBS-002), which adds a
# prometheus.remote_write and points them at it. Until then, the UI on :12345 shows what is scraped.
alloy:
  clustering:
    enabled: true

  configMap:
    content: |
      logging {
        level  = "info"
        format = "logfmt"
      }

      prometheus.operator.servicemonitors "default" {
        forward_to = []
        clustering {
          enabled = true
        }
      }

      prometheus.operator.podmonitors "default" {
        forward_to = []
        clustering {
          enabled = true
        }
      }

      // The kubelet and cAdvisor (per-container CPU and memory) on every node. The service account
      // token is authorised for nodes/metrics by the chart's ClusterRole.
      discovery.kubernetes "nodes" {
        role = "node"
      }

      prometheus.scrape "kubelet" {
        job_name          = "kubelet"
        targets           = discovery.kubernetes.nodes.targets
        scheme            = "https"
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config {
          ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        }
        forward_to = []
        clustering {
          enabled = true
        }
      }

      prometheus.scrape "cadvisor" {
        job_name          = "cadvisor"
        targets           = discovery.kubernetes.nodes.targets
        metrics_path      = "/metrics/cadvisor"
        scheme            = "https"
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config {
          ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        }
        forward_to = []
        clustering {
          enabled = true
        }
      }

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi

# Alloy's own metrics, through its own ServiceMonitor.
serviceMonitor:
  enabled: true
