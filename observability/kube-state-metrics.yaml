# Metrics about Kubernetes objects (pods, deployments, restarts), read from the API server.
prometheus:
  monitor:
    enabled: true

# live-arch draws this edge: Alloy scrapes kube-state-metrics.
annotations:
  live-arch.igorsilva.dev/flows-to: "observability/alloy:metrics"

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi
