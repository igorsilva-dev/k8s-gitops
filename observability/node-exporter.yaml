# Metrics about each node (CPU, memory, disk, network). One pod per node, on the host network.
prometheus:
  monitor:
    enabled: true

# live-arch draws this edge: Alloy scrapes every node-exporter.
daemonsetAnnotations:
  live-arch.igorsilva.dev/flows-to: "observability/alloy:metrics"

resources:
  requests:
    cpu: 10m
    memory: 24Mi
  limits:
    memory: 64Mi
