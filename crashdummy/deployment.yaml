apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashdummy
  labels:
    app.kubernetes.io/name: crashdummy
    app.kubernetes.io/part-of: crashdummy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crashdummy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crashdummy
        app.kubernetes.io/part-of: crashdummy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: crashdummy
          image: ghcr.io/igorsilva-dev/crashdummy:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 10000
          env:
            - name: PORT
              value: "10000"
            - name: CRASHDUMMY_CONFIG_DIR
              value: /config
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: mappings
              mountPath: /config/mappings
            - name: proxies
              mountPath: /config/proxies
            - name: stubs
              mountPath: /config/stubs
      volumes:
        - name: mappings
          configMap:
            name: crashdummy-mappings
        - name: proxies
          configMap:
            name: crashdummy-proxies
        - name: stubs
          configMap:
            name: crashdummy-stubs
