# crashdummy serves /metrics on its HTTP port: request counts and latency per route.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: crashdummy
  labels:
    app.kubernetes.io/name: crashdummy
    app.kubernetes.io/part-of: crashdummy
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: crashdummy
  endpoints:
    - port: http
      path: /metrics
